<div class="stat-card"
  [class.border-left-warning]="accentColor === 'warning'"
  [class.border-left-danger]="accentColor === 'danger'">

  <div class="stat-top">
    <span>{{ title }}</span>
  </div>

  <div class="stat-bottom">
    <h2>{{ value }}</h2>
    <span *ngIf="badgeText" class="badge-text" [ngClass]="'text-' + badgeColor">{{ badgeText }}</span>
    <i *ngIf="iconClass" [ngClass]="iconClass" [style.color]="iconColor" class="stat-icon"></i>
  </div>
</div>

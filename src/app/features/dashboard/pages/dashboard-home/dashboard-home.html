<div class="dashboard-header">
  <div class="title-area">
    <h1>Visão Geral</h1>
    <p>Bem-vindo ao painel de controle central</p>
  </div>
</div>

<div class="stats-grid">
  <app-stat-card
    title="ITENS EM ESTOQUE"
    [value]="(totalEstoque | number:'1.0-0') || '0'">
  </app-stat-card>

  <app-stat-card
    title="VALOR DO PATRIMÔNIO"
    [value]="(valorPatrimonio | currency:'BRL':'symbol':'1.2-2') || 'R$ 0,00'">
  </app-stat-card>

  <app-stat-card
    title="ALERTAS DE ESTOQUE BAIXO"
    [value]="(alertasEstoqueBaixo | number:'1.0-0') || '0'"
    accentColor="danger"
    iconClass="ph-fill ph-warning"
    iconColor="#ef4444">
  </app-stat-card>

  <app-stat-card
    title="ATIVOS EM MANUTENÇÃO"
    [value]="(ativosManutencao | number:'1.0-0') || '0'"
    accentColor="warning"
    iconClass="ph-fill ph-wrench"
    iconColor="#f59e0b">
  </app-stat-card>
</div>

<div class="bottom-grid">

  <div class="card chart-section">
    <div class="chart-header">
      <h3>Consumo vs. Aquisições (Mensal)</h3>
      <div class="chart-legend">
        <span class="legend-item"><span class="dot gray"></span> Consumo</span>
        <span class="legend-item"><span class="dot blue"></span> Aquisições</span>
      </div>
    </div>

    <div class="chart-body">
      <div class="y-axis">
        <span *ngFor="let tick of chartYTicks">{{ tick }}</span>
      </div>

      <div class="chart-area">
        <div class="gridlines">
          <div class="gridline" *ngFor="let tick of chartYTicks"></div>
        </div>

        <div class="chart-bars">
          <div class="bar-col" *ngFor="let m of chartMonths">
            <div class="bars">
              <div class="bar-wrap">
                <span class="bar-value">{{ m.consumo }}</span>
                <div class="bar consumption" [style.height.%]="m.consumoPct"></div>
              </div>
              <div class="bar-wrap">
                <span class="bar-value">{{ m.aquisicao }}</span>
                <div class="bar acquisition" [style.height.%]="m.aquisicaoPct"></div>
              </div>
            </div>
            <span class="bar-label">{{ m.label }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card actions-section">
    <div class="actions-header">
      <h3>Ações Críticas</h3>
      <span class="alert-badge" *ngIf="criticalActions.length > 0">{{ criticalActions.length }} ALERTAS</span>
    </div>

    <app-action-list [actions]="criticalActions" (actionClicked)="navigateTo($event)"></app-action-list>
  </div>

</div>

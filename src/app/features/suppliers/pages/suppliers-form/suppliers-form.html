<aside class="supplier-drawer">
  <div class="drawer-header">
    <div>
      <h2>{{ mode === 'edit' ? 'Editar Fornecedor' : 'Cadastro de Fornecedor' }}</h2>
      <p>Insira os dados do parceiro no registro global.</p>
    </div>

    <button class="drawer-close" type="button" (click)="closeDrawer()">
      <i class="ph ph-x"></i>
    </button>
  </div>

  <div class="drawer-content">
    <section class="form-card">
      <div class="form-section-header">
        <span class="section-number">01</span>
        <h3>Identificação Corporativa</h3>
      </div>

      <div class="form-grid">
        <div class="form-group full">
          <label>Razão Social</label>
          <input type="text" placeholder="Ex: Global Logistics Solutions LTDA" />
        </div>

        <div class="form-group">
          <label>CNPJ / CPF</label>
          <input type="text" placeholder="00.000.000/0000-00" />
        </div>

        <div class="form-group">
          <label>Categoria</label>
          <select>
            <option>Hardware</option>
            <option>Serviços</option>
            <option>Papelaria</option>
            <option>Limpeza</option>
          </select>
        </div>
      </div>
    </section>

    <section class="form-card">
      <div class="form-section-header">
        <span class="section-number">02</span>
        <h3>Ponto de Contato</h3>
      </div>

      <div class="form-grid">
        <div class="form-group full">
          <label>Nome do Responsável</label>
          <input type="text" placeholder="Nome completo" />
        </div>

        <div class="form-group">
          <label>E-mail</label>
          <input type="email" placeholder="email@fornecedor.com" />
        </div>

        <div class="form-group">
          <label>Telefone</label>
          <input type="text" placeholder="+55 (11) 00000-0000" />
        </div>
      </div>
    </section>

    <section class="form-card">
      <div class="form-section-header">
        <span class="section-number">03</span>
        <h3>Endereço Operacional</h3>
      </div>

      <div class="form-grid">
        <div class="form-group wide">
          <label>Endereço</label>
          <input type="text" placeholder="Rua, Av..." />
        </div>

        <div class="form-group small">
          <label>CEP</label>
          <input type="text" placeholder="00000-000" />
        </div>

        <div class="form-group">
          <label>Cidade</label>
          <input type="text" placeholder="Cidade" />
        </div>

        <div class="form-group">
          <label>Bairro</label>
          <input type="text" placeholder="Bairro" />
        </div>
      </div>
    </section>
  </div>

  <div class="drawer-footer">
    <button class="btn-save" type="button">
      <i class="ph ph-floppy-disk"></i>
      Salvar Fornecedor
    </button>

    <span>Rascunho salvo automaticamente a cada 30 segundos</span>
  </div>
</aside>

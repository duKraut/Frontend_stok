<aside class="supplier-drawer">
  <div class="drawer-header">
    <div>
      <h2>{{ mode === 'create' ? 'Cadastro de Fornecedor' : mode === 'edit' ? 'Editar Fornecedor' : 'Detalhes do Fornecedor' }}</h2>
      <p>Insira os dados do parceiro no registro global.</p>
    </div>

    <button class="drawer-close" type="button" (click)="closeDrawer()">
      <i class="ph ph-x"></i>
    </button>
  </div>

  <div class="drawer-content">
    <section class="form-card">
      <div class="form-section-header">
        <span class="section-number">01</span>
        <h3>Identificação Corporativa</h3>
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" checked [disabled]="mode === 'view'"/>
          <span>Fornecedor Ativo</span>
        </label>
      </div>

      <div class="form-grid">
        <div class="form-group full">
          <label>Nome / Razão Social</label>
          <input type="text" placeholder="Ex: Global Logistics Solutions LTDA" [disabled]="mode === 'view'"/>
        </div>

        <div class="form-group">
          <label>CNPJ / CPF</label>
          <input type="text" placeholder="00.000.000/0000-00" [disabled]="mode === 'view'"/>
        </div>

        <div class="form-group">
          <label>Categoria</label>
          <select>
            <option>Hardware</option>
            <option>Serviços</option>
            <option>Papelaria</option>
            <option>Limpeza</option>
          </select>
        </div>
      </div>
    </section>

    <section class="form-card">
      <div class="form-section-header">
        <span class="section-number">02</span>
        <h3>Ponto de Contato</h3>
      </div>

      <div class="form-grid">
        <div class="form-group full">
          <label>Nome do Responsável</label>
          <input type="text" placeholder="Nome completo" [disabled]="mode === 'view'"/>
        </div>

        <div class="form-group">
          <label>E-mail</label>
          <input type="email" placeholder="email@fornecedor.com" [disabled]="mode === 'view'"/>
        </div>

        <div class="form-group">
          <label>Telefone</label>
          <input type="text" placeholder="+55 (11) 00000-0000" [disabled]="mode === 'view'"/>
        </div>
      </div>
    </section>

    <section class="form-card">
      <div class="form-section-header">
        <span class="section-number">03</span>
        <h3>Endereço Operacional</h3>
      </div>

      <div class="form-grid">
        <div class="form-group wide">
          <label>Endereço</label>
          <input type="text" placeholder="Rua, Av..." [disabled]="mode === 'view'"/>
        </div>

        <div class="form-group small">
          <label>CEP</label>
          <input type="text" placeholder="00000-000" [disabled]="mode === 'view'"/>
        </div>

        <div class="form-group">
          <label>Cidade</label>
          <input type="text" placeholder="Cidade" [disabled]="mode === 'view'"/>
        </div>

        <div class="form-group">
          <label>Bairro</label>
          <input type="text" placeholder="Bairro" [disabled]="mode === 'view'"/>
        </div>
      </div>
    </section>
  </div>

  <div class="drawer-footer" *ngIf="mode !== 'view'">
    <button class="btn-save" type="button">
      <i class="ph ph-floppy-disk"></i>
      Salvar Fornecedor
    </button>
  </div>
</aside>

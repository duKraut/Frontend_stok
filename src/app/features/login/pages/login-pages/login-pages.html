<div class="login-screen">
  <div class="login-card">
    <section class="login-panel left-panel">
      <div class="brand">Stok Sistemas</div>

      <div class="hero">
        <h1>Gestão inteligente de estoque e patrimônio.</h1>
        <p>
          Controle centralizado para ativos, suprimentos e operações internas.
        </p>
      </div>

      <div class="footer-info">
        <span>AMBIENTE SEGURO</span>
        <span>•</span>
        <span>ACESSO CORPORATIVO</span>
      </div>
    </section>

    <section class="login-panel right-panel">
      <div class="form-wrapper">
        <h2>Bem-vindo</h2>
        <p>Entre para acessar o sistema.</p>

        <form class="login-form">
          <div class="form-group">
            <label for="email">Usuário</label>
            <input id="email" type="text" placeholder="Digite seu usuário" />
          </div>

          <div class="form-group">
            <label for="password">Senha</label>
            <input id="password" type="password" placeholder="Digite sua senha" />
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" />
              <span>Lembrar acesso</span>
            </label>

            <a href="#">Esqueci minha senha</a>
          </div>

          <button routerLink="/dashboard" routerLinkActive="active" type="submit" class="btn-login">Entrar</button>
        </form>
      </div>
    </section>
  </div>
</div>
